name: Build Mac DMG

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download bundled Node
        run: |
          mkdir -p bundled-node
          curl -L https://nodejs.org/dist/v20.19.1/node-v20.19.1-darwin-arm64.tar.gz -o /tmp/node-arm64.tar.gz
          tar -xzf /tmp/node-arm64.tar.gz -C /tmp
          cp /tmp/node-v20.19.1-darwin-arm64/bin/node bundled-node/node-arm64
          chmod +x bundled-node/node-arm64
          curl -L https://nodejs.org/dist/v20.19.1/node-v20.19.1-darwin-x64.tar.gz -o /tmp/node-x64.tar.gz
          tar -xzf /tmp/node-x64.tar.gz -C /tmp
          cp /tmp/node-v20.19.1-darwin-x64/bin/node bundled-node/node-x64
          chmod +x bundled-node/node-x64
          cp -r /tmp/node-v20.19.1-darwin-arm64/lib/node_modules/npm bundled-node/npm_modules
          ls -la bundled-node/

      - name: Setup bundled-mcp
        run: |
          git clone --depth 1 https://github.com/LewisWJackson/tradingview-mcp-jackson bundled-mcp
          # L'MCP deve riconoscere anche il TradingView incorporato come target
          # CDP di tipo "webview". Il pattern compare in più file (connection.js,
          # core/tab.js, ...), quindi patchiamo TUTTI i .js sotto src/ per essere
          # robusti a future modifiche upstream.
          grep -rl "t\.type === 'page'" bundled-mcp/src \
            | xargs sed -i '' "s/t\.type === 'page'/(t.type === 'page' || t.type === 'webview')/g"
          # Verifica: deve patchare almeno 2 file (connection.js + tab.js)
          PATCHED=$(grep -rl "t.type === 'page' || t.type === 'webview'" bundled-mcp/src | wc -l | tr -d ' ')
          echo "File MCP patchati: $PATCHED"
          if [ "$PATCHED" -lt 2 ]; then
            echo "ERRORE: patch incompleta (atteso almeno 2 file)"; exit 1
          fi
          cd bundled-mcp && npm install && cd ..
          # Rimuove la cartella .git: inutile nell'app, contiene file read-only
          # che bloccano la rimozione della quarantena (xattr) all'installazione
          rm -rf bundled-mcp/.git

      - name: Install dependencies
        run: npm install

      - name: Build Mac DMG
        run: npm run dist-mac
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg
